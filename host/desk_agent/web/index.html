<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Agent R1 - 局域网控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    .card h3 { margin-top: 0; color: #38bdf8; }
    .viewer { width: 100%; height: 340px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .overlay-status { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.75); padding: 5px 10px; border-radius: 4px; font-size: 12px; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0ea5e9; }
    .btn-stop { background: #ef4444; color: white; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-green { background: #22c55e; color: #0f172a; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🤖 Desk Agent R1 管理控制台</h2>
    <div style="display:flex; align-items:center; gap:8px;">
      <input id="tokenInput" type="password" placeholder="Access Token (局域网鉴权)" style="background:#1e293b; border:1px solid #475569; color:#f8fafc; padding:6px 10px; border-radius:4px; font-size:12px; width:160px;" />
      <button class="btn" style="padding:6px 12px; font-size:12px;" onclick="saveToken()">保存认证</button>
      <div>相机: <span class="badge" id="cameraConnectionStatus">未连接</span></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>局域网单帧摄像头与云台</h3>
      <div class="viewer">
        <div id="videoPlaceholder">正在获取相机租约...</div>
        <img id="cameraFrame" style="display:none; width:100%; height:100%; object-fit:contain;" alt="最新相机单帧" />
        <div class="overlay-status" id="frameStats">租约: 等待 | 相机: 不可用</div>
      </div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn" id="refreshCamera" onclick="refreshSnapshot()" disabled>拍摄新单帧</button>
        <button class="btn btn-stop" id="closeCamera" onclick="releaseCameraLease()" disabled>关闭查看并释放租约</button>
      </div>
      <div class="controls">
        <div></div>
        <button class="btn" onclick="sendMotion('tilt_up')">▲ 仰头</button>
        <div></div>
        <button class="btn" onclick="sendMotion('pan_left')">◀ 左转</button>
        <button class="btn btn-stop" onclick="sendMotion('stop')">■ 停止</button>
        <button class="btn" onclick="sendMotion('pan_right')">▶ 右转</button>
        <div></div>
        <button class="btn" onclick="sendMotion('tilt_down')">▼ 低头</button>
        <div></div>
      </div>
    </div>

    <div class="card">
      <h3>系统与任务总览</h3>
      <p><strong>Tuya 对话引擎:</strong> TClaw 在线</p>
      <p><strong>Python Application:</strong> 泰山派常驻运行</p>
      <p><strong>Home Assistant:</strong> 实体已对账</p>
      <p><strong>Windows Codex:</strong> 伴侣服务就绪</p>
      <hr style="border-color: #334155; margin: 15px 0;">
      <h4>最近提醒与备忘</h4>
      <ul style="padding-left: 20px; font-size: 14px; color: #94a3b8;">
        <li>09:30 - 晨会日常提醒 (已同步)</li>
        <li>待办: 审查 G1 最小贯通真机测试数据</li>
      </ul>
    </div>
  </div>

  <script>
    const clientId = "web-client-" + Math.random().toString(36).substring(2, 9);
    let leaseActive = false;
    let leaseAcquired = false;
    let heartbeatTimer = null;
    let snapshotTimer = null;
    let frameExpiryTimer = null;
    let snapshotInFlight = false;
    let currentObjectUrl = null;
    let lastFrameSeq = null;
    let currentPan = 90;
    let currentTilt = 120;

    function getAuthHeaders(extra = {}) {
      const token = localStorage.getItem("desk_agent_token") || "";
      const headers = { ...extra };
      if (token) {
        headers["Authorization"] = "Bearer " + token;
        headers["X-Desk-Agent-Token"] = token;
      }
      return headers;
    }

    function saveToken() {
      const tok = document.getElementById("tokenInput").value.trim();
      if (tok) {
        localStorage.setItem("desk_agent_token", tok);
        alert("Token 已保存，将随请求发送至 Host");
      } else {
        localStorage.removeItem("desk_agent_token");
        alert("Token 已清除");
      }
      acquireCameraLease();
    }

    async function rpcCall(operation, args = {}, keepalive = false) {
      try {
        const resp = await fetch("/api/rpc", {
          method: "POST",
          keepalive,
          headers: getAuthHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({
            schema_version: "1.0.0",
            request_id: "req-" + Date.now(),
            operation: operation,
            client_id: clientId,
            arguments: args,
            expires_at: new Date(Date.now() + 5000).toISOString()
          })
        });
        if (resp.status === 401) {
          document.getElementById("videoPlaceholder").innerText = "⚠️ 401 未授权：请在右上角输入合法的 Access Token 并点击保存认证";
          return { status: "failed", error: { code: "UNAUTHORIZED", message: "401 Unauthorized" } };
        }
        return await resp.json();
      } catch (err) {
        console.error("RPC call failed:", err);
        return { status: "failed", error: { message: err.message } };
      }
    }

    async function acquireCameraLease() {
      const res = await rpcCall("resource.camera.acquire", { client_id: clientId, lease_duration_ms: 10000 });
      if (res.status === "succeeded" && res.result && res.result.granted) {
        leaseActive = true;
        leaseAcquired = true;
        document.getElementById("refreshCamera").disabled = false;
        document.getElementById("closeCamera").disabled = false;
        document.getElementById("cameraConnectionStatus").innerText = "等待首帧";
        document.getElementById("frameStats").innerText = "租约: 激活 | 相机: 等待真实 JPEG";
        startSnapshotLoop();
      } else {
        leaseActive = false;
        leaseAcquired = false;
        const reason = res.error ? res.error.message : (res.result ? res.result.reason : "未知错误");
        hideFrame("无法获取相机租约: " + reason);
        document.getElementById("frameStats").innerText = "租约: 被拒绝 (" + reason + ")";
        document.getElementById("cameraConnectionStatus").innerText = "不可用";
      }
    }

    async function releaseCameraLease() {
      const hadLease = leaseAcquired;
      leaseActive = false;
      leaseAcquired = false;
      clearInterval(heartbeatTimer);
      clearTimeout(snapshotTimer);
      clearTimeout(frameExpiryTimer);
      document.getElementById("refreshCamera").disabled = true;
      document.getElementById("closeCamera").disabled = true;
      hideFrame("查看已关闭，相机不可用");
      document.getElementById("frameStats").innerText = "租约: 已释放";
      document.getElementById("cameraConnectionStatus").innerText = "已断开";
      if (hadLease) await rpcCall("resource.camera.release", { client_id: clientId }, true);
    }

    function hideFrame(message) {
      clearTimeout(frameExpiryTimer);
      const img = document.getElementById("cameraFrame");
      img.style.display = "none";
      img.removeAttribute("src");
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
      const placeholder = document.getElementById("videoPlaceholder");
      placeholder.style.display = "block";
      placeholder.innerText = message;
    }

    function markLeaseUnavailable(message) {
      leaseActive = false;
      clearInterval(heartbeatTimer);
      clearTimeout(snapshotTimer);
      document.getElementById("refreshCamera").disabled = true;
      hideFrame(message);
      document.getElementById("frameStats").innerText = "租约: 不可用 | 相机: 已断开";
      document.getElementById("cameraConnectionStatus").innerText = "不可用";
    }

    async function refreshSnapshot() {
      if (!leaseActive || snapshotInFlight) return;
      snapshotInFlight = true;
      clearTimeout(snapshotTimer);
      const button = document.getElementById("refreshCamera");
      button.disabled = true;
      try {
        const url = "/api/camera/snapshot?client_id=" + encodeURIComponent(clientId) + "&t=" + Date.now();
        const resp = await fetch(url, { headers: getAuthHeaders(), cache: "no-store" });
        if (!leaseActive) return;
        if (resp.status === 200) {
          const source = resp.headers.get("X-Frame-Source") || "unknown";
          const isHardware = resp.headers.get("X-Frame-Hardware") === "1";
          const ageMs = Number(resp.headers.get("X-Frame-Age-Ms"));
          const frameSeq = resp.headers.get("X-Frame-Seq") || "--";
          const blob = await resp.blob();
          if (!isHardware || source !== "hardware_sensor" || !Number.isFinite(ageMs) || ageMs > 2000 || blob.type !== "image/jpeg") {
            hideFrame("相机不可用：没有新鲜的硬件 JPEG");
            document.getElementById("frameStats").innerText = "租约: 激活 | 相机: 无新鲜硬件帧";
            document.getElementById("cameraConnectionStatus").innerText = "不可用";
            return;
          }
          try {
            const decoded = await createImageBitmap(blob);
            decoded.close();
          } catch (decodeError) {
            hideFrame("相机不可用：收到的 JPEG 无法解码");
            document.getElementById("cameraConnectionStatus").innerText = "不可用";
            return;
          }
          if (!leaseActive) return;
          hideFrame("正在显示最新硬件帧...");
          currentObjectUrl = URL.createObjectURL(blob);
          const img = document.getElementById("cameraFrame");
          img.src = currentObjectUrl;
          img.style.display = "block";
          document.getElementById("videoPlaceholder").style.display = "none";
          lastFrameSeq = frameSeq;
          document.getElementById("frameStats").innerText = `租约: 激活 | 帧序号: #${frameSeq} | 新鲜度: ${ageMs} ms`;
          document.getElementById("cameraConnectionStatus").innerText = "已连接";
          frameExpiryTimer = setTimeout(() => {
            if (leaseActive && lastFrameSeq === frameSeq) {
              hideFrame("画面已过期，等待下一张新帧...");
              document.getElementById("frameStats").innerText = "租约: 激活 | 相机: 等待新帧";
              document.getElementById("cameraConnectionStatus").innerText = "等待新帧";
            }
          }, Math.max(0, 2000 - ageMs));
        } else if (resp.status === 401) {
          markLeaseUnavailable("401 未授权：请检查 Access Token");
        } else {
          const errorBody = await resp.json().catch(() => ({}));
          const reason = errorBody.error || `HTTP ${resp.status}`;
          hideFrame(`相机不可用：${reason}`);
          document.getElementById("frameStats").innerText = `租约: ${leaseActive ? "激活" : "不可用"} | 相机: ${reason}`;
          document.getElementById("cameraConnectionStatus").innerText = "不可用";
          if (resp.status === 403 && reason !== "NO_ACTIVE_LEASE") markLeaseUnavailable(`相机租约不可用：${reason}`);
        }
      } catch (e) {
        console.error("Snapshot request failed:", e);
        hideFrame("相机不可用：Host 连接中断，等待恢复");
        document.getElementById("frameStats").innerText = "租约: 等待恢复 | 相机: 不可用";
        document.getElementById("cameraConnectionStatus").innerText = "连接中断";
      } finally {
        snapshotInFlight = false;
        button.disabled = !leaseActive;
        if (leaseActive) snapshotTimer = setTimeout(refreshSnapshot, 5000);
      }
    }

    function startSnapshotLoop() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(async () => {
        if (!leaseActive) return;
        const res = await rpcCall("resource.camera.acquire", { client_id: clientId, lease_duration_ms: 10000 });
        if (res.status !== "succeeded" || !res.result || !res.result.granted) {
          markLeaseUnavailable("相机租约续订失败");
        }
      }, 5000);
      refreshSnapshot();
    }

    async function sendMotion(action) {
      if (action === "pan_left") currentPan = Math.max(0, currentPan - 15);
      else if (action === "pan_right") currentPan = Math.min(180, currentPan + 15);
      else if (action === "tilt_up") currentTilt = Math.min(140, currentTilt + 10);
      else if (action === "tilt_down") currentTilt = Math.max(100, currentTilt - 10);
      else if (action === "stop") {
        return await rpcCall("resource.motion.stop", { emergency: false });
      }

      const res = await rpcCall("resource.motion.move", {
        pan_deg: currentPan,
        tilt_deg: currentTilt,
        duration_ms: 400
      });
      console.log("Motion response:", res);
    }

    // Auto-acquire on load and release the lease when the page is hidden/closed.
    window.addEventListener("load", () => {
      const savedToken = localStorage.getItem("desk_agent_token");
      if (savedToken) {
        document.getElementById("tokenInput").value = savedToken;
      }
      acquireCameraLease();
    });
    window.addEventListener("pagehide", () => { releaseCameraLease(); });
  </script>
</body>
</html>
