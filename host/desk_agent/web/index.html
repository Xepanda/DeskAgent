<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Agent R1 - 局域网控制台</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    .card h3 { margin-top: 0; color: #38bdf8; }
    .viewer { width: 100%; height: 320px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .overlay-status { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #0ea5e9; }
    .btn-stop { background: #ef4444; color: white; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-green { background: #22c55e; color: #0f172a; }
  </style>
</head>
<body>
  <div class="header">
    <h2>🤖 Desk Agent R1 管理控制台</h2>
    <div>状态: <span class="badge badge-green">在线 (Online)</span></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>局域网实时摄像头与云台</h3>
      <div class="viewer">
        <div id="videoPlaceholder">正在获取租约与摄像头画面...</div>
        <img id="cameraFrame" style="display:none; width:100%; height:100%; object-fit:contain;" alt="Camera Stream" />
        <div class="overlay-status" id="frameStats">FPS: -- | 延迟: -- ms | 租约: 激活</div>
      </div>
      <div class="controls">
        <div></div>
        <button class="btn" onclick="sendMotion('tilt_up')">▲ 仰头</button>
        <div></div>
        <button class="btn" onclick="sendMotion('pan_left')">◀ 左转</button>
        <button class="btn btn-stop" onclick="sendMotion('stop')">■ 停止</button>
        <button class="btn" onclick="sendMotion('pan_right')">▶ 右转</button>
        <div></div>
        <button class="btn" onclick="sendMotion('tilt_down')">▼ 低头</button>
        <div></div>
      </div>
    </div>

    <div class="card">
      <h3>系统与任务总览</h3>
      <p><strong>Tuya 对话引擎:</strong> TClaw 在线</p>
      <p><strong>Python Application:</strong> 泰山派常驻运行</p>
      <p><strong>Home Assistant:</strong> 实体已对账</p>
      <p><strong>Windows Codex:</strong> 伴侣服务就绪</p>
      <hr style="border-color: #334155; margin: 15px 0;">
      <h4>最近提醒与备忘</h4>
      <ul style="padding-left: 20px; font-size: 14px; color: #94a3b8;">
        <li>09:30 - 晨会日常提醒 (已同步)</li>
        <li>待办: 审查 G1 最小贯通真机测试数据</li>
      </ul>
    </div>
  </div>

  <script>
    const clientId = "web-client-" + Math.random().toString(36).substring(2, 9);
    let leaseActive = false;
    let heartbeatTimer = null;
    let frameTimer = null;

    async function rpcCall(operation, args = {}) {
      try {
        const resp = await fetch("/api/rpc", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            schema_version: "1.0.0",
            request_id: "req-" + Date.now(),
            operation: operation,
            client_id: clientId,
            arguments: args,
            expires_at: new Date(Date.now() + 5000).toISOString()
          })
        });
        return await resp.json();
      } catch (err) {
        console.error("RPC call failed:", err);
        return { status: "failed", error: { message: err.message } };
      }
    }

    async function acquireCameraLease() {
      const res = await rpcCall("resource.camera.acquire", { client_id: clientId, lease_duration_ms: 10000 });
      if (res.status === "succeeded" && res.result && res.result.granted) {
        leaseActive = true;
        document.getElementById("frameStats").innerText = "租约: 激活 (Active) | 帧率: 连接中";
        startPolling();
      } else {
        leaseActive = false;
        const reason = res.error ? res.error.message : (res.result ? res.result.reason : "未知错误");
        document.getElementById("videoPlaceholder").innerText = "无法获取租约: " + reason;
        document.getElementById("frameStats").innerText = "租约: 被拒绝 (" + reason + ")";
      }
    }

    async function releaseCameraLease() {
      if (leaseActive) {
        await rpcCall("resource.camera.release", { client_id: clientId });
        leaseActive = false;
        clearInterval(heartbeatTimer);
        clearInterval(frameTimer);
        const img = document.getElementById("cameraFrame");
        img.style.display = "none";
        const placeholder = document.getElementById("videoPlaceholder");
        placeholder.style.display = "block";
        placeholder.innerText = "查看会话已关闭";
        document.getElementById("frameStats").innerText = "租约: 已释放";
      }
    }

    function startPolling() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (frameTimer) clearInterval(frameTimer);

      // Heartbeat lease renewal every 5 seconds
      heartbeatTimer = setInterval(async () => {
        if (!leaseActive) return;
        const res = await rpcCall("resource.camera.acquire", { client_id: clientId, lease_duration_ms: 10000 });
        if (res.status !== "succeeded" || !res.result || !res.result.granted) {
          leaseActive = false;
          clearInterval(frameTimer);
          const img = document.getElementById("cameraFrame");
          img.style.display = "none";
          const placeholder = document.getElementById("videoPlaceholder");
          placeholder.style.display = "block";
          placeholder.innerText = "租约失效已断开";
          document.getElementById("frameStats").innerText = "租约续订失败，已断开";
        }
      }, 5000);

      // Active live frame retrieval (5 fps)
      frameTimer = setInterval(async () => {
        if (!leaseActive) return;
        try {
          const t0 = performance.now();
          const resp = await fetch("/api/camera/frame?client_id=" + clientId);
          if (resp.status === 200) {
            const blob = await resp.blob();
            const latency = Math.round(performance.now() - t0);
            const frameSeq = resp.headers.get("X-Frame-Seq") || "--";
            const img = document.getElementById("cameraFrame");
            const placeholder = document.getElementById("videoPlaceholder");
            img.src = URL.createObjectURL(blob);
            img.style.display = "block";
            placeholder.style.display = "none";
            document.getElementById("frameStats").innerText = `租约: 激活 (Active) | 帧序号: #${frameSeq} | 延迟: ${latency} ms`;
          } else if (resp.status === 403) {
            leaseActive = false;
            clearInterval(frameTimer);
            const img = document.getElementById("cameraFrame");
            img.style.display = "none";
            const placeholder = document.getElementById("videoPlaceholder");
            placeholder.style.display = "block";
            placeholder.innerText = "无有效租约，画面已遮盖";
            document.getElementById("frameStats").innerText = "租约已过期或被抢占";
          }
        } catch (e) {
          console.error("Frame pull error:", e);
        }
      }, 200);
    }

    async function sendMotion(action) {
      console.log("Dispatching motion action:", action);
      let pan = 90, tilt = 120;
      if (action === "pan_left") pan = 60;
      if (action === "pan_right") pan = 120;
      if (action === "tilt_up") tilt = 135;
      if (action === "tilt_down") tilt = 105;

      const res = await rpcCall("resource.motion.move", { action: action, pan: pan, tilt: tilt });
      console.log("Motion response:", res);
    }

    // Auto-acquire on load and release on unload
    window.addEventListener("load", acquireCameraLease);
    window.addEventListener("beforeunload", releaseCameraLease);
  </script>
</body>
</html>
